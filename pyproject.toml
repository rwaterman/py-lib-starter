[project]
name = "py-lib-starter"
version = "1.0.0"
description = "A minimal library starter for projects written in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Rick Waterman" }]
requires-python = ">=3.12"
keywords = ["Python", "Library", "Starter"]
dependencies = []

[project.urls]
Repository = "https://github.com/rwaterman/py-lib-starter"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/test_*.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "T20"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.poe.tasks]
clean = "rm -rf dist"
build = ["clean", "_build"]
_build = "uv build"
format = "ruff format"
format-check = "ruff format --check"
lint = "ruff check"
lint-fix = "ruff check --fix"
typecheck = "mypy"
test = "pytest"
verify = ["format-check", "lint", "typecheck", "test", "build"]
publish = ["verify", "_publish"]
_publish = "uv publish"
